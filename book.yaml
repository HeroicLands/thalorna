# The book entry's `document` names — which notes The World of Thalorna carries
# and in what order. Selection is one filter per note `type`, so the volume
# reads world before rules before adventures before appendix: setting first
# (Lore, Places, Affiliations, Beings), then the mechanical content a
# character sheet draws on (Skills, Mystical Abilities, Mysteries,
# Concoctions, Weapons), then the Scenarios that use all of it, then
# Reference as a closing appendix. `miscgear` carries no chapter of its own
# yet — six notes, not worth a section — and neither does `folder`, which is
# compendium structure rather than content.
contents:
    - sectionName: Lore
      contents:
          - filter: "type = 'lore'"
    - sectionName: Places
      contents:
          - filter: "type = 'place'"
    - sectionName: Affiliations
      contents:
          - filter: "type = 'affiliation'"
    - sectionName: Beings
      contents:
          - filter: "type = 'being'"
    - sectionName: Skills
      contents:
          - filter: "type = 'skill'"
    - sectionName: Mystical Abilities
      contents:
          - filter: "type = 'mysticalability'"
    - sectionName: Mysteries
      contents:
          - filter: "type = 'mystery'"
    - sectionName: Concoctions
      contents:
          - filter: "type = 'concoctiongear'"
    - sectionName: Weapons
      contents:
          - filter: "type = 'weapongear'"
    - sectionName: Scenarios
      contents:
          - filter: "type = 'scenario'"
    - sectionName: Reference
      contents:
          - filter: "type = 'doc' AND subType = 'reference'"
