<svg viewBox="0 0 1020 760" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <!-- background -->
  <rect x="0" y="0" width="1020" height="760" fill="#f5edd9"/>

  <!-- ===== CITY EXTENT (built-up area) ===== -->
  <path d="M 200,160 C 240,110 360,98 470,112 C 600,92 740,100 845,150 C 905,182 902,280 876,372 C 902,470 856,560 766,600 C 650,648 470,652 366,624 C 250,640 168,560 168,452 C 150,352 168,232 200,160 Z"
        fill="#ece0c0" stroke="none"/>

  <!-- The Clearance / pomerium (dashed bound, just outside built area) -->
  <path d="M 192,150 C 234,96 360,84 472,98 C 606,76 748,86 856,138 C 922,172 918,280 892,374 C 920,478 870,576 776,618 C 652,668 466,672 360,642 C 236,660 150,576 150,452 C 130,348 152,222 192,150 Z"
        fill="none" stroke="#b0863f" stroke-width="2.5" stroke-dasharray="9 5"/>
  <text x="565" y="92" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a6a2f"
        paint-order="stroke" stroke="#f5edd9" stroke-width="3">the Clearance — the pomerium (city bound, ~100 ft wide, kept empty)</text>

  <!-- ===== RIVER VYLARIS (west flank) ===== -->
  <path d="M 18,0 C 70,130 8,255 58,375 C 100,495 26,615 58,760 L 138,760 C 104,615 170,495 128,375 C 90,255 152,130 112,0 Z"
        fill="#86b4d2" stroke="#5d93b3" stroke-width="1.5"/>
  <text x="74" y="250" text-anchor="middle" font-size="15" font-style="italic" fill="#22536e"
        transform="rotate(-90 74 250)" paint-order="stroke" stroke="#86b4d2" stroke-width="3">River Vylaris</text>

  <!-- Wharves (river bank below Mons Rípae) -->
  <g stroke="#7a5a2c" stroke-width="2">
    <line x1="128" y1="450" x2="170" y2="452"/>
    <line x1="124" y1="478" x2="166" y2="480"/>
    <line x1="128" y1="506" x2="170" y2="508"/>
  </g>
  <text x="150" y="436" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5a4626"
        paint-order="stroke" stroke="#ece0c0" stroke-width="3">the Wharves</text>

  <!-- ===== FLATS / VALLEYS / SADDLES (level ground) ===== -->
  <!-- Grand Market flats -->
  <ellipse cx="455" cy="245" rx="78" ry="40" fill="#e3d3a6" opacity="0.65"/>
  <text x="455" y="243" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6a5631"
        paint-order="stroke" stroke="#ece0c0" stroke-width="3">Grand Market (flats)</text>

  <!-- Circus valley (between Vétus and Rípae) -->
  <ellipse cx="320" cy="430" rx="86" ry="34" fill="#e3d3a6" opacity="0.65" transform="rotate(-34 320 430)"/>
  <text x="312" y="432" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6a5631"
        transform="rotate(-34 312 432)" paint-order="stroke" stroke="#ece0c0" stroke-width="3">Circus (valley)</text>

  <!-- Forum saddle (between Aquila and Corónus) -->
  <text x="626" y="316" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6a5631"
        paint-order="stroke" stroke="#ece0c0" stroke-width="3">Forum (saddle)</text>

  <!-- ===== HILLS ===== -->
  <!-- helper styling: nested ellipses suggest elevation; halo'd labels -->

  <!-- Mons Rípae -->
  <g>
    <ellipse cx="255" cy="480" rx="72" ry="58" fill="#cdbd8c"/>
    <ellipse cx="255" cy="480" rx="47" ry="38" fill="#bda86a"/>
    <ellipse cx="255" cy="474" rx="24" ry="19" fill="#9d8a4f"/>
    <circle cx="255" cy="470" r="3" fill="#6e5f33"/>
    <ellipse cx="255" cy="480" rx="72" ry="58" fill="none" stroke="#8c7d4d" stroke-width="0.8" opacity="0.45"/>
    <text x="255" y="500" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3a3322"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">Mons Rípae</text>
    <text x="255" y="515" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4a3f29"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">~50 m · the River Hill (Warrens)</text>
  </g>

  <!-- Mons Vétus -->
  <g>
    <ellipse cx="380" cy="365" rx="78" ry="62" fill="#cdbd8c"/>
    <ellipse cx="380" cy="365" rx="51" ry="41" fill="#bda86a"/>
    <ellipse cx="380" cy="359" rx="26" ry="20" fill="#9d8a4f"/>
    <circle cx="380" cy="355" r="3" fill="#6e5f33"/>
    <ellipse cx="380" cy="365" rx="78" ry="62" fill="none" stroke="#8c7d4d" stroke-width="0.8" opacity="0.45"/>
    <text x="380" y="386" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3a3322"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">Mons Vétus</text>
    <text x="380" y="401" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4a3f29"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">~65 m · the Old Hill (faded)</text>
  </g>

  <!-- Mons Sápiens -->
  <g>
    <ellipse cx="660" cy="178" rx="66" ry="54" fill="#cdbd8c"/>
    <ellipse cx="660" cy="178" rx="44" ry="36" fill="#bda86a"/>
    <ellipse cx="660" cy="172" rx="22" ry="18" fill="#9d8a4f"/>
    <circle cx="660" cy="168" r="3" fill="#6e5f33"/>
    <ellipse cx="660" cy="178" rx="66" ry="54" fill="none" stroke="#8c7d4d" stroke-width="0.8" opacity="0.45"/>
    <text x="660" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3322"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">Mons Sápiens</text>
    <text x="660" y="193" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4a3f29"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">~55 m · Scholars' Hill</text>
  </g>

  <!-- Mons Corónus -->
  <g>
    <ellipse cx="700" cy="305" rx="72" ry="60" fill="#cdbd8c"/>
    <ellipse cx="700" cy="305" rx="48" ry="40" fill="#bda86a"/>
    <ellipse cx="700" cy="299" rx="24" ry="20" fill="#9d8a4f"/>
    <circle cx="700" cy="295" r="3" fill="#6e5f33"/>
    <ellipse cx="700" cy="305" rx="72" ry="60" fill="none" stroke="#8c7d4d" stroke-width="0.8" opacity="0.45"/>
    <text x="700" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3322"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">Mons Corónus</text>
    <text x="700" y="320" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4a3f29"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">~70 m · the Heights (old)</text>
  </g>

  <!-- Mons Lauríne -->
  <g>
    <ellipse cx="797" cy="432" rx="70" ry="58" fill="#cdbd8c"/>
    <ellipse cx="797" cy="432" rx="46" ry="38" fill="#bda86a"/>
    <ellipse cx="797" cy="426" rx="23" ry="19" fill="#9d8a4f"/>
    <circle cx="797" cy="422" r="3" fill="#6e5f33"/>
    <ellipse cx="797" cy="432" rx="70" ry="58" fill="none" stroke="#8c7d4d" stroke-width="0.8" opacity="0.45"/>
    <text x="797" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3322"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">Mons Lauríne</text>
    <text x="797" y="447" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4a3f29"
          paint-order="stroke" stroke="#cdbd8c" stroke-width="3">~60 m · Heights / Gilded Qtr</text>
  </g>

  <!-- Mons Aquila (highest, the citadel hill) -->
  <g>
    <ellipse cx="545" cy="332" rx="102" ry="86" fill="#cbb784"/>
    <ellipse cx="545" cy="332" rx="70" ry="59" fill="#b89a55"/>
    <ellipse cx="545" cy="324" rx="42" ry="35" fill="#9d8038"/>
    <ellipse cx="545" cy="318" rx="20" ry="16" fill="#82682c"/>
    <circle cx="545" cy="312" r="3.5" fill="#5c4a1f"/>
    <ellipse cx="545" cy="332" rx="102" ry="86" fill="none" stroke="#8c7438" stroke-width="0.9" opacity="0.5"/>
    <text x="545" y="333" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f2713"
          paint-order="stroke" stroke="#cbb784" stroke-width="3.5">Mons Aquila</text>
    <text x="545" y="349" text-anchor="middle" font-size="10.5" font-style="italic" fill="#3a2f15"
          paint-order="stroke" stroke="#cbb784" stroke-width="3">~95 m · highest · citadel hill</text>
    <text x="545" y="362" text-anchor="middle" font-size="10.5" font-style="italic" fill="#3a2f15"
          paint-order="stroke" stroke="#cbb784" stroke-width="3">(Urbs Aquilion — Layer 2)</text>
  </g>

  <!-- ===== BEYOND THE BOUNDS ===== -->
  <!-- Campus Vylaris (riverside commons, north, outside the Clearance) -->
  <path d="M 150,30 C 220,18 300,24 350,46 C 320,72 240,86 168,80 C 150,70 140,48 150,30 Z" fill="#bcd49e" stroke="#8aa86a" stroke-width="1"/>
  <text x="252" y="56" text-anchor="middle" font-size="12" font-style="italic" fill="#3f5a2c"
        paint-order="stroke" stroke="#bcd49e" stroke-width="3">Campus Vylaris (commons)</text>

  <!-- Necropolis (east, outside the Clearance) -->
  <g fill="#b7ada0" stroke="#7d7468" stroke-width="0.8">
    <rect x="930" y="330" width="14" height="14"/>
    <rect x="952" y="318" width="11" height="11"/>
    <rect x="948" y="348" width="13" height="13"/>
    <rect x="928" y="360" width="10" height="10"/>
    <rect x="966" y="340" width="12" height="12"/>
  </g>
  <text x="952" y="392" text-anchor="middle" font-size="12" font-style="italic" fill="#5a4f44"
        paint-order="stroke" stroke="#f5edd9" stroke-width="3">Necropolis</text>

  <!-- Outskirts (faint, beyond the bounds) -->
  <g fill="#cbb89a" opacity="0.7">
    <rect x="690" y="650" width="6" height="6"/><rect x="705" y="660" width="6" height="6"/>
    <rect x="720" y="648" width="6" height="6"/><rect x="735" y="662" width="6" height="6"/>
    <rect x="750" y="652" width="6" height="6"/><rect x="668" y="662" width="6" height="6"/>
    <rect x="780" y="600" width="6" height="6"/><rect x="800" y="588" width="6" height="6"/>
  </g>
  <text x="735" y="688" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6a5a3f"
        paint-order="stroke" stroke="#f5edd9" stroke-width="3">Outskirts (beyond the bounds)</text>

  <!-- ===== MAP FURNITURE ===== -->
  <text x="510" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#3a2f15" letter-spacing="1.5">ÔRZÂRA — The Site</text>
  <text x="510" y="52" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6a5631">Layer 1: the six hills, the River Vylaris, and the bounds  ·  schematic, not to exact scale</text>

  <!-- North arrow -->
  <g transform="translate(965 80)">
    <polygon points="0,-22 7,8 0,0 -7,8" fill="#3a2f15"/>
    <text x="0" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a2f15">N</text>
  </g>

  <!-- Scale bar (~2 km) -->
  <g transform="translate(60 712)">
    <rect x="0" y="0" width="117" height="8" fill="#3a2f15"/>
    <rect x="117" y="0" width="117" height="8" fill="#f5edd9" stroke="#3a2f15" stroke-width="1"/>
    <text x="0" y="26" text-anchor="middle" font-size="11" fill="#3a2f15">0</text>
    <text x="117" y="26" text-anchor="middle" font-size="11" fill="#3a2f15">1</text>
    <text x="234" y="26" text-anchor="middle" font-size="11" fill="#3a2f15">2 km</text>
    <text x="117" y="-8" text-anchor="middle" font-size="10" font-style="italic" fill="#6a5631">city ~6 km across</text>
  </g>

  <!-- Legend -->
  <g transform="translate(812 628)">
    <rect x="0" y="0" width="196" height="120" fill="#fbf6e8" stroke="#b9975b" stroke-width="1.2" rx="4"/>
    <text x="10" y="20" font-size="12.5" font-weight="bold" fill="#3a2f15">Legend</text>
    <ellipse cx="22" cy="38" rx="13" ry="9" fill="#bda86a"/><ellipse cx="22" cy="38" rx="6" ry="4" fill="#9d8038"/>
    <text x="44" y="42" font-size="11" fill="#3a2f15">hill (shading = height)</text>
    <rect x="14" y="54" width="18" height="9" fill="#86b4d2"/>
    <text x="44" y="62" font-size="11" fill="#3a2f15">River Vylaris</text>
    <line x1="14" y1="80" x2="32" y2="80" stroke="#b0863f" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="44" y="84" font-size="11" fill="#3a2f15">the Clearance (pomerium)</text>
    <rect x="14" y="96" width="18" height="9" fill="#bcd49e"/>
    <text x="44" y="104" font-size="11" fill="#3a2f15">parkland / commons</text>
  </g>
</svg>
