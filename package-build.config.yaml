contentPackage: thalorna
currentDate: "720.1"
defaultCalendar: commoncal
packageKind: modules

compatibility:
    minimum: "14.359"
    verified: "14.364"

# The Item and Actor packs are SoHL documents and stamp this version; declaring
# it restricts no world, so the journals read under any system.
systems:
    sohl:
        manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/download/v0.8.8/system.json
        compatibility: { minimum: "0.8.8", verified: "0.8.8" }

relationships:
    recommends:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/download/v0.8.8/system.json
          compatibility:
              minimum: "0.8.8"
              verified: "0.8.8"
          # Its Item packs are this repository's item catalogue: a Thalorna
          # being nests items addressed by shortcode, and almost all of those
          # belong to sohl. `package-build deps fetch` caches them, keyed by
          # the `verified` version above so a build names one artifact.
          itemCatalog: true

stats:
    lastModifiedBy: sohlbuilder00000

itemBuilders: sohl

authors:
    - name: Tom Rodriguez
      email: toasty@heroiclands.org
      url: https://www.heroiclands.org
      discord: toasty#8538

packs:
    - { name: items, label: Items, type: Item, system: sohl }
    - { name: journals, label: Journals, type: JournalEntry }
    - { name: actors, label: Actors, type: Actor, system: sohl }

publish:
    # This package's content is its site, so it mounts at the package root and
    # the prefix is empty.
    address:
        prefix: ""

