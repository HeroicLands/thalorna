contentPackage: thalorna
packageKind: modules

compatibility:
    minimum: "14.359"
    verified: "14.364"

relationships:
    systems:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/download/v0.8.7/system.json
          compatibility:
              minimum: "0.8.7"
              verified: "0.8.7"
          # Its Item packs are this repository's item catalogue: a Thalorna
          # being nests items addressed by shortcode, and almost all of those
          # belong to sohl. `content-build deps fetch` caches them, keyed by
          # the `verified` version above so a build names one artifact.
          itemCatalog: true

stats:
    lastModifiedBy: sohlbuilder00000

itemBuilders: sohl

packs:
    - { name: items, label: Items, type: Item }
    - { name: journals, label: Journals, type: JournalEntry }
    - { name: actors, label: Actors, type: Actor }

publish:
    # This repository's content is original work with no publishing
    # restriction, so it publishes in full.
    site: content
    # This package's content is its site, so it mounts at the package root and
    # the prefix is empty.
    address:
        prefix: ""

pdf:
    title: The World of Thalorna
    subtitle: A Song of Heroic Lands Sourcebook
    document: book.yaml
    out: build/pdf
    # All three faces are named, because an unnamed one is not a default but a
    # fallback: `sans` resolves to `serif` when it is absent, so the headings
    # the renderer sets in the sans slot come out in the body face.
    #
    # One superfamily sets the whole book, which is what it was chosen for —
    # matched metrics across body, headings and code from one designer. The mono
    # is the narrowest of the three: it carries the printable ASCII a fence needs
    # and little beyond it, and every fence in this tree is ASCII. A fence that
    # reaches outside it is the thing to check, because Typst reports nothing
    # when a glyph is missing.
    fonts:
        serif: Libertinus Serif
        sans: Libertinus Sans
        mono: Libertinus Mono

site:
    assets: https://cdn.heroiclands.org
    description: The World of Thalorna — realms, peoples, faiths, creatures, and the lore behind them.
    hugo:
        params:
            search: true
    # No `trees:` — this repository publishes no documentation tree beside its
    # content. No `pass:` — this repository has no body-rewrite bundle of its
    # own.

    # A relative `url` here is resolved against this site's own base, so it
    # survives a move.
    notfound:
        heroimage: images/banners/tapestry-of-dreams.webp
        tagline: This world has no page at
        sitenoun: world
        links:
            - {
                  title: The World of Thalorna,
                  url: /,
                  text: "Every section of the setting, from the top.",
              }
            - {
                  title: Realms and Regions,
                  url: /polity/,
                  text: "The realms of Thalorna, their rulers, and the lands they hold.",
              }
            - {
                  title: Characters,
                  url: /character/,
                  text: "The people of the world — rulers, rivals, and the merely notorious.",
              }
            - {
                  title: Creatures,
                  url: /creature/,
                  text: "What lives out there, and what it does to those who meet it.",
              }

packageBuild:
    assets:
        - { from: src/thalorna.mjs, to: thalorna.mjs }
        - { from: lang, to: lang }
        - { from: styles, to: styles }
        - { from: README.md, to: README.md }
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: src/LICENSE, to: src/LICENSE }
        - { from: assets/icons, to: assets/icons }
        - { from: assets/images, to: assets/images }
        - { from: assets/LICENSE, to: assets/LICENSE }

    # Matches the SoHL system: every icon's default-black fill is rewritten to
    # follow the Foundry theme, so a module icon and a system icon sitting in
    # the same compendium listing look the same.
    assetTransform: ./utils/svg-theme.mjs

    manifest:
        title: Thalorna Setting
        descriptionHtml: Items, Actors, Journals, Scenes, and other assets to enable play in the Thalorna setting for Song of Heroic Lands
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
        languages:
            - lang: en
              name: English
              path: lang/en.json
        esmodules:
            - thalorna.mjs
        styles:
            - src: styles/thalorna.css
              layer: thalorna
        # Names every pack this package ships, so everything Thalorna adds
        # appears together in the compendium sidebar under one folder. Adding
        # a pack to `packs:` above means adding it here.
        packFolders:
            - name: Thalorna
              sorting: m
              color: "#008000"
              packs:
                  - items
                  - journals
                  - actors
        media:
            - type: setup
              url: systems/sohl/assets/ui/sohl-setup.webp
              thumbnail: systems/sohl/assets/ui/sohl-setup-thumb.webp
            - type: logo
              url: systems/sohl/assets/ui/sohl-logo.webp
            - type: icon
              url: systems/sohl/assets/ui/sohl-icon.webp
            - type: banner
              url: systems/sohl/assets/ui/sohl-banner.webp
        socket: true
