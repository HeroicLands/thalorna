name: Changesets

# Reports the changesets a pull request adds. The check lives in HeroicLands/.github (actions/changesets).

on:
    pull_request:
        types: [opened, reopened, synchronize]
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

jobs:
    changesets:
        name: Changeset review
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/changesets@37b1fa7cb6eb63fe6e54531e66a4d0ca61094442 # main
              with:
                  token: ${{ github.token }}
