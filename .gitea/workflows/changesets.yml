name: Changesets

# One changeset per pull request, and a Version Packages pull request approved
# on its final commit. The check lives in HeroicLands/.github (actions/changesets).

on:
    pull_request:
        types: [opened, reopened, synchronize]
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

jobs:
    changesets:
        name: Changeset review
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/changesets@0bb7fa3d15b9cad324e5c859808de7660998bfe0 # main
              with:
                  token: ${{ github.token }}
