name: Changesets

# One changeset per user-visible change, and a Version Packages pull request
# approved on its final commit. The check lives in HeroicLands/.github (actions/changesets).

on:
    pull_request:
        types: [opened, reopened, synchronize]
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

jobs:
    changesets:
        name: Changeset review
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/changesets@3f413e927488a3deaadccf543f1e93743977558a # main
              with:
                  token: ${{ github.token }}
