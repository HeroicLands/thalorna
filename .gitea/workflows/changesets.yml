name: Changesets

# Reports the changesets a pull request adds. The check lives in HeroicLands/.github (actions/changesets).

on:
    pull_request:
        types: [opened, reopened, synchronize]
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

jobs:
    changesets:
        name: Changeset review
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/changesets@e8b0371176155cdaa12c5a2b89a688b219734af4 # main
              with:
                  token: ${{ github.token }}
