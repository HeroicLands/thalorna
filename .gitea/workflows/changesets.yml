name: Changesets

# Reports the changesets a pull request adds. The check lives in HeroicLands/.github (actions/changesets).

on:
    pull_request:
        types: [opened, reopened, synchronize]
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

jobs:
    changesets:
        name: Changeset review
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/changesets@5a31ee2627a7b464710f0942dbfb4c19a4f90f94 # main
              with:
                  token: ${{ github.token }}
