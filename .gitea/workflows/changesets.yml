name: Changesets

# Reports the changesets a pull request adds. The check lives in HeroicLands/.github (actions/changesets).

on:
    pull_request:
        types: [opened, reopened, synchronize]
    pull_request_review:
        types: [submitted, dismissed]

permissions:
    contents: read
    pull-requests: read

jobs:
    changesets:
        name: Changeset review
        runs-on: light
        steps:
            - uses: HeroicLands/.github/actions/changesets@5d2db91909feba6a8c99013ac15c9a155f066445 # main
              with:
                  token: ${{ github.token }}
