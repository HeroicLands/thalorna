# Build pages without deployment secrets; deployment consumes only the artifact.
name: Publish the Thalorna site

on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: thalorna-site-deploy
    cancel-in-progress: false

jobs:
    build:
        if: >-
            ${{ github.server_url != 'https://github.com' && vars.HL_DEPLOY_ENABLED == 'true'
            && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        runs-on: build
        timeout-minutes: 60
        outputs:
            mode: ${{ steps.select.outputs.mode }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
                  cache: npm
            - name: Select the trusted publishing mode and root
              id: select
              run: |
                  node utils/site-publication.mjs select
                  if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                    git merge-base --is-ancestor "$GITHUB_SHA" origin/main
                  fi
            - name: Install dependencies
              run: npm ci
            - name: Check publishing fixtures
              run: node --test utils/site-publication.test.mjs
            - name: Fetch declared dependencies
              run: npm run build:deps
            - name: Build the selected site
              env:
                  BUILD_ROOT: ${{ steps.select.outputs.root }}
              run: node_modules/.bin/package-build site build --root "$BUILD_ROOT"
            - name: Validate and stage the complete page tree
              run: |
                  node utils/site-publication.mjs verify build/site
                  mkdir -p publication
                  cp -R build/site publication/site
            - name: Checkout trusted artifact tools
              if: ${{ steps.select.outputs.mode == 'internal' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  repository: HeroicLands/.github
                  github-server-url: https://git.pupluppy.org
                  ref: 5d2db91909feba6a8c99013ac15c9a155f066445
                  path: trusted-deploy
                  persist-credentials: false
            - name: Inventory the internal pages artifact
              if: ${{ steps.select.outputs.mode == 'internal' }}
              env:
                  PUBLICATION_PACKAGE: thalorna
                  SOURCE_SHA: ${{ github.sha }}
                  MIN_PAGES: 1001
                  MAX_PAGES: 0
              run: node trusted-deploy/actions/internal-site-deploy/publish.mjs manifest publication
            - name: Save the verified site
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: thalorna-site-publication
                  path: publication/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 3

    internal:
        needs: build
        if: ${{ needs.build.outputs.mode == 'internal' }}
        uses: HeroicLands/.github/.gitea/workflows/deploy-internal-site.yml@5d2db91909feba6a8c99013ac15c9a155f066445
        with:
            artifact-name: thalorna-site-publication
            package: thalorna
            source-sha: ${{ github.sha }}
            min-pages: 1001
            max-pages: 0
        secrets:
            PREVIEW_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}

    public:
        needs: build
        if: ${{ needs.build.outputs.mode == 'public' }}
        runs-on: ubuntu-vm
        timeout-minutes: 30
        steps:
            - name: Checkout trusted public payload checks
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
            - name: Download built pages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: thalorna-site-publication
                  path: publication
            - name: Validate the public payload before deployment credentials
              run: node utils/site-publication.mjs verify publication/site
            # This project owns the existing custom domain and Worker route.
            - name: Ensure the hosting project exists
              id: hosting
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: node utils/site-publication.mjs ensure-public
            - name: Deploy to Cloudflare Pages (production)
              if: ${{ steps.hosting.outputs.enabled == 'true' }}
              uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy publication/site --project-name=sohl-thalorna --branch=main
