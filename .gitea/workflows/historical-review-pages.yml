# Builds the rendered pages of one approved historical revision for review and
# uploads them as a short-lived artifact. The workflow has one job, receives no
# secrets and has no dependent job, so it cannot publish.
name: Build historical review pages

on:
    workflow_dispatch:
        inputs:
            source-sha:
                description: Full lowercase 40-character commit SHA, an ancestor of main
                required: true
                type: string
            min-pages:
                description: Minimum number of index pages the build must contain
                required: false
                default: "1001"
                type: string

permissions:
    contents: read

concurrency:
    group: thalorna-historical-review-pages
    cancel-in-progress: false

jobs:
    build:
        if: ${{ github.server_url != 'https://github.com' && github.ref == 'refs/heads/main' }}
        runs-on: build
        timeout-minutes: 60
        steps:
            - name: Checkout the trusted workflow revision
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  path: trusted
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
            - name: Validate the requested source
              id: validate
              env:
                  TRUSTED_HEAD: ${{ github.sha }}
                  REQUESTED_SHA: ${{ inputs.source-sha }}
              run: node trusted/utils/historical-review.mjs validate trusted "$REQUESTED_SHA"
            - name: Checkout the validated source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ steps.validate.outputs.validated }}
                  path: source
                  persist-credentials: false
            - name: Verify the checkout
              id: checkout
              env:
                  VALIDATED_SHA: ${{ steps.validate.outputs.validated }}
              run: node trusted/utils/historical-review.mjs verify-checkout source "$VALIDATED_SHA"
            - name: Install dependencies
              working-directory: source
              run: npm ci
            - name: Fetch declared dependencies
              working-directory: source
              run: npm run build:deps
            - name: Build the requested source
              working-directory: source
              env:
                  NODE_OPTIONS: --max-old-space-size=6144
              run: node_modules/.bin/package-build site build --root internal.heroiclands.org
            - name: Record provenance and stage the artifact
              env:
                  MIN_PAGES: ${{ inputs.min-pages }}
                  REQUESTED_SHA: ${{ inputs.source-sha }}
                  VALIDATED_SHA: ${{ steps.validate.outputs.validated }}
                  ACTUAL_SHA: ${{ steps.checkout.outputs.actual }}
              run: >-
                  node trusted/utils/historical-review.mjs stage source source/build/site review
                  "$REQUESTED_SHA" "$VALIDATED_SHA" "$ACTUAL_SHA"
            - name: Verify the staged artifact
              env:
                  MIN_PAGES: ${{ inputs.min-pages }}
              run: node trusted/utils/historical-review.mjs verify review
            - name: Save the review pages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: thalorna-review-pages-${{ steps.validate.outputs.validated }}
                  path: review/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 3
