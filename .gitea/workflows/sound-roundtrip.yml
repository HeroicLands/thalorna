# Retain the complete on-demand sound diagnostic and its provenance.
name: Sound round trips
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    diagnostic:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}
            - run: npm ci
            - name: Record provenance
              run: |
                  mkdir -p build/sound-report
                  git rev-parse HEAD > build/sound-report/revision.txt
                  npm ls @heroiclands/package-build @heroiclands/fonts --json > build/sound-report/dependencies.json
            - name: Check diagnostic fixtures
              run: node --test utils/sound-roundtrip.test.mjs > build/sound-report/fixtures.txt 2>&1
            - name: Check sound round trips
              run: npm run check:sound-roundtrip > build/sound-report/diagnostic.txt 2>&1
            - name: Retain report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: sound-roundtrip-report
                  path: build/sound-report/
                  if-no-files-found: error
                  retention-days: 30
