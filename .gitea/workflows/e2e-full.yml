name: Thalorna Foundry e2e

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        types: [labeled, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: thalorna-e2e-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    requested:
        runs-on: light
        if: >-
            github.event_name != 'pull_request' ||
            contains(github.event.pull_request.labels.*.name, 'ci/e2e')
        outputs:
            run: ${{ steps.request.outputs.run }}
        steps:
            - name: Record explicit request
              id: request
              run: echo "run=true" >> "$GITHUB_OUTPUT"
    full-e2e:
        needs: requested
        if: >-
            needs.requested.outputs.run == 'true' &&
            !startsWith(github.event.pull_request.title, 'WIP:')
        uses: HeroicLands/.github/.gitea/workflows/e2e-full.yml@5d2db91909feba6a8c99013ac15c9a155f066445 # main
        with:
            package: thalorna
            build-script: build:noci
