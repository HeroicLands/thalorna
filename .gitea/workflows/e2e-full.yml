name: Thalorna Foundry e2e

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        types: [labeled, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: thalorna-e2e-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    requested:
        runs-on: light
        if: >-
            github.event_name != 'pull_request' ||
            contains(github.event.pull_request.labels.*.name, 'ci/e2e')
        outputs:
            run: ${{ steps.request.outputs.run }}
            ready: ${{ steps.request.outputs.ready }}
        steps:
            - name: Record explicit request and the pull request title decision
              id: request
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  echo "run=true" >> "$GITHUB_OUTPUT"
                  case "${PR_TITLE-}" in
                      [Ww][Ii][Pp]:*) echo "ready=false" >> "$GITHUB_OUTPUT" ;;
                      *) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
                  esac
    full-e2e:
        needs: requested
        if: >-
            needs.requested.outputs.run == 'true' &&
            needs.requested.outputs.ready == 'true'
        uses: HeroicLands/.github/.gitea/workflows/e2e-full.yml@5d2db91909feba6a8c99013ac15c9a155f066445 # main
        with:
            package: thalorna
            build-script: build:noci
