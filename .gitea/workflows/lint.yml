# Formatting, prose, and registry guards run beside the shared content run.
# The build job fetches pinned dependencies, prepares the content index,
# calendars and assets, then checks frontmatter and links and compiles packs
# in one content session. Both required checks include content failures.
#
# A pull request checks formatting on its changed files only.
# Each job restores node_modules by Node version and package-lock.json hash;
# npm ci runs on cache misses. build/ is gitignored, so content builds start cold.
# Retired-name and concordance sweeps run on demand.
name: Lint

on:
    pull_request:
        types: [opened, reopened, synchronize]
    # Post-merge signal too: nothing else checks `main` between releases.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # https://github.com/HeroicLands/fonts/commit/3ec43cd207ba13072a0806421a2a62efb7aabca6
    FONTS_REVISION: 3ec43cd207ba13072a0806421a2a62efb7aabca6

jobs:
    format:
        name: Formatting, markdown and localization
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The pull-request diff needs the merge base with the target branch.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24

            # Restored on an unchanged lockfile and Node version; the install
            # runs only on a miss. A restore leaves `node_modules/.bin` intact.
            - name: Cache node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

            - name: Cache npm downloads
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/npm-cache
                  key: ${{ runner.os }}-npm-node-24-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              run: npm ci --cache "$RUNNER_TEMP/npm-cache"

            # A pull request checks the files it changes; a push checks the whole tree.
            - name: Check formatting
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  if [ -z "$BASE_REF" ]; then
                      npm run lint:format
                      exit
                  fi
                  git diff --name-only --diff-filter=d -z "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.list"
                  # A new formatter or its configuration can change any file's verdict.
                  if tr '\0' '\n' < "$RUNNER_TEMP/changed.list" | grep -qxE 'package-lock\.json|prettier\.config\.js|\.prettierignore'; then
                      npm run lint:format
                      exit
                  fi
                  if [ ! -s "$RUNNER_TEMP/changed.list" ]; then
                      echo "No changed files to format."
                      exit 0
                  fi
                  xargs -0 npm run lint:format -- < "$RUNNER_TEMP/changed.list"

            # markdownlint: document structure, and links that do not link.
            - name: Check markdown
              if: ${{ !cancelled() }}
              run: npm run lint:markdown

            # No dotted-prefix collision in `lang/*.json`: Foundry drops a
            # translation file whose key is both a leaf and a branch.
            - name: Check localization files
              if: ${{ !cancelled() }}
              run: npm run lint:lang

    guards:
        name: Reference people and utility tests
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The utility tests read pinned revisions with `git show`, so
                  # the job needs the history a shallow checkout leaves out.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24

            # Restored on an unchanged lockfile and Node version; the install
            # runs only on a miss. A restore leaves `node_modules/.bin` intact.
            - name: Cache node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

            - name: Cache npm downloads
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/npm-cache
                  key: ${{ runner.os }}-npm-node-24-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              run: npm ci --cache "$RUNNER_TEMP/npm-cache"

            # A named person the prose leans on resolves to a note.
            - name: Check reference people
              run: npm run lint:reference-people

            # The tree's own guards: the concordance, the deployment headers. Two
            # pull requests that pass alone can fail together, and this catches
            # that before merge.
            - name: Run the utility tests
              if: ${{ !cancelled() }}
              run: node --test 'utils/**/*.test.mjs'

    # Every Khazari, Nordmal and Khelathi word in this pull request's language
    # notes is set through its font; a word the font cannot set fails by name.
    # Both font consumers use FONTS_REVISION.
    fonts:
        name: Font lexicon guards
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Fetch the fonts
              run: |
                  git init "$RUNNER_TEMP/fonts"
                  git -C "$RUNNER_TEMP/fonts" remote add origin https://github.com/HeroicLands/fonts.git
                  git -C "$RUNNER_TEMP/fonts" fetch --depth 1 origin "$FONTS_REVISION"
                  git -C "$RUNNER_TEMP/fonts" checkout --detach FETCH_HEAD

            # The guards write each form through the fonts' mapping tool, which imports package-build.
            - name: Install the fonts' Node packages
              run: npm ci --prefix "$RUNNER_TEMP/fonts" --ignore-scripts

            # Only what the guards import, at the versions the fonts pin.
            - name: Install the guards' packages
              run: |
                  grep -iE '^(fonttools|uharfbuzz|pillow|pyyaml)==' "$RUNNER_TEMP/fonts/requirements.txt" > "$RUNNER_TEMP/guard-requirements.txt"
                  python3 -m venv "$RUNNER_TEMP/venv"
                  "$RUNNER_TEMP/venv/bin/pip" install --quiet -r "$RUNNER_TEMP/guard-requirements.txt"

            - name: Pirzath Carved
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/pirzath/guard.py"
                  --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Khazari.md"
                  --map-note "$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Pirzath_Spelling.md"

            - name: Pirzath Hand
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/pirzath-hand/guard.py"
                  --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Khazari.md"
                  --map-note "$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Pirzath_Spelling.md"

            - name: Thuravark Carved
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/thuravark-carved/guard.py"
                  --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Nordmal.md"
                  --map-note "$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Thuravark_Spelling.md"

            - name: Qalezu Hand
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/qalezu-hand/guard.py"
                  --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Khelathi.md"
                  --map-note "$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Qalezu_Spelling.md"

            - name: Semaron Kuriale
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/semaron-kuriale/guard.py"
                  --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Vylari.md"
                  --map-note "$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Semaron_Spelling.md"

            - name: Helónika
              if: ${{ !cancelled() }}
              run: |
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/helonika/guard.py" \
                      --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Helonic.md" \
                      --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Valtari.md" \
                      --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Byzarian.md" \
                      --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Bethuan.md" \
                      --map-note helonika="$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Helonika_Spelling.md" \
                      --map-note bizarian="$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Bizarian_Spelling.md" \
                      --map-note bethuan="$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Bethuan_Spelling.md"

            - name: Vedyakshara Classical
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/vedyakshara/guard.py"
                  --thalorna "$GITHUB_WORKSPACE"
                  --note "$GITHUB_WORKSPACE/assets/content/Skills/Languages/Vedyari.md"
                  --map-note "$GITHUB_WORKSPACE/assets/content/Lore/Scripts/Vedyakshara_Spelling.md"

    lint:
        name: Content, prose, and registry checks
        runs-on: lint
        needs: [format, guards, fonts, build]
        if: ${{ !cancelled() }}

        steps:
            - name: Every check passed
              run: |
                  results='${{ join(needs.*.result, ' ') }}'
                  echo "check results: $results"
                  for r in $results; do
                      [ "$r" = success ] || { echo "a check did not pass"; exit 1; }
                  done

    build:
        name: Content pack compile
        runs-on: build

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Clear content publication
              id: publication_reset
              run: rm -rf build/content-index

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24

            # Restored on an unchanged lockfile and Node version; the install
            # runs only on a miss. A restore leaves `node_modules/.bin` intact.
            - name: Cache node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

            - name: Cache npm downloads
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/npm-cache
                  key: ${{ runner.os }}-npm-node-24-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              run: npm ci --cache "$RUNNER_TEMP/npm-cache"

            # Prepare dependencies and assets, then validate and compile the
            # content in one session.
            - name: Compile the content packs
              run: npm run build:db

            # The marker survives failures after publication. Missing publication
            # fails this guard without reading a partial or stale index.
            - name: Veldikko
              if: ${{ !cancelled() && steps.publication_reset.outcome == 'success' }}
              run: |
                  if [ ! -f build/content-index/.publication-ready ]; then
                      echo "Veldikko: no fresh content index was published in this run." >&2
                      exit 1
                  fi
                  reference=$(mktemp -d "$RUNNER_TEMP/veldikko-reference.XXXXXX")
                  git init "$reference"
                  git -C "$reference" remote add origin https://github.com/HeroicLands/fonts.git
                  git -C "$reference" sparse-checkout set tools/veldikko
                  git -C "$reference" fetch --depth 1 --filter=blob:none origin "$FONTS_REVISION"
                  git -C "$reference" checkout --detach FETCH_HEAD
                  node utils/veldikko-guard.mjs --index build/content-index/thalorna-metadata.jsonl --fonts "$reference"
