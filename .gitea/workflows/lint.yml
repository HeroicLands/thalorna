# Formatting, prose, and registry guards run beside the shared content run.
# The build job fetches pinned dependencies, prepares the content index,
# calendars and assets, then checks frontmatter and links and compiles packs
# in one content session. Both required checks include content failures.
#
# A pull request checks formatting on its changed files only.
# Each job restores node_modules by Node version and package-lock.json hash;
# npm ci runs on cache misses. build/ is gitignored, so content builds start cold.
# The retired-name sweep runs on demand.
name: Lint

on:
    pull_request:
        types: [opened, reopened, synchronize]
    # Post-merge signal too: nothing else checks `main` between releases.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # https://github.com/HeroicLands/fonts/commit/e6bdd6b7a406e3f8bd0547b3fbf9f4fdb014303e
    FONTS_REVISION: e6bdd6b7a406e3f8bd0547b3fbf9f4fdb014303e

jobs:
    # One decision on the pull request title for every long check. The heavy
    # jobs and the aggregate read this job's output.
    gate:
        name: Pull request readiness
        runs-on: light
        outputs:
            ready: ${{ steps.ready.outputs.ready }}
        steps:
            - name: Decide whether the pull request is ready
              id: ready
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  case "${PR_TITLE-}" in
                      [Ww][Ii][Pp]:*) echo "ready=false" >> "$GITHUB_OUTPUT" ;;
                      *) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
                  esac

    format:
        name: Formatting, markdown and localization
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The pull-request diff needs the merge base with the target branch.
                  fetch-depth: 0

            - name: Check canonical git hooks
              uses: HeroicLands/.github/actions/githooks@5d2db91909feba6a8c99013ac15c9a155f066445 # main

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}

            # Restored on an unchanged lockfile and Node version; the install
            # runs only on a miss. A restore leaves `node_modules/.bin` intact.
            - name: Cache node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

            - name: Cache npm downloads
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/npm-cache
                  key: ${{ runner.os }}-npm-node-24-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              run: npm ci --cache "$RUNNER_TEMP/npm-cache"

            # A pull request checks the files it changes; a push checks the whole tree.
            - name: Check formatting
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  if [ -z "$BASE_REF" ]; then
                      npm run lint:format
                      exit
                  fi
                  git diff --name-only --diff-filter=d -z "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.list"
                  # A new formatter or its configuration can change any file's verdict.
                  if tr '\0' '\n' < "$RUNNER_TEMP/changed.list" | grep -qxE 'package-lock\.json|prettier\.config\.js|\.prettierignore'; then
                      npm run lint:format
                      exit
                  fi
                  if [ ! -s "$RUNNER_TEMP/changed.list" ]; then
                      echo "No changed files to format."
                      exit 0
                  fi
                  xargs -0 npm run lint:format -- < "$RUNNER_TEMP/changed.list"

            # markdownlint: document structure, and links that do not link.
            - name: Check markdown
              if: ${{ !cancelled() }}
              run: npm run lint:markdown

            # No dotted-prefix collision in `lang/*.json`: Foundry drops a
            # translation file whose key is both a leaf and a branch.
            - name: Check localization files
              if: ${{ !cancelled() }}
              run: npm run lint:lang
            - name: Check WIP workflow gating
              if: ${{ !cancelled() }}
              run: node --test utils/wip-workflows.test.mjs

    guards:
        name: Reference people and utility tests
        needs: gate
        if: ${{ needs.gate.outputs.ready == 'true' }}
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The utility tests read pinned revisions with `git show`, so
                  # the job needs the history a shallow checkout leaves out.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}

            # Restored on an unchanged lockfile and Node version; the install
            # runs only on a miss. A restore leaves `node_modules/.bin` intact.
            - name: Cache node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

            - name: Cache npm downloads
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/npm-cache
                  key: ${{ runner.os }}-npm-node-24-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              run: npm ci --cache "$RUNNER_TEMP/npm-cache"

            # A named person the prose leans on resolves to a note.
            - name: Check reference people
              run: npm run lint:reference-people

            # A closing ay, ey or oy in any name or word, English verse and
            # English register labels included.
            - name: Check vowel pairs
              run: npm run lint:vowel-pairs

            # The tree's own guards, the deployment headers among them. Two
            # pull requests that pass alone can fail together, and this catches
            # that before merge.
            - name: Run the utility tests
              if: ${{ !cancelled() }}
              run: node --test 'utils/**/*.test.mjs'

    # Every Khazari, Nordmal and Khelathi word in this pull request's language
    # notes is set through its font; a word the font cannot set fails by name.
    # Native geometry uses FONTS_REVISION; language spellings use installed public encoders.
    fonts:
        name: Font lexicon guards
        needs: gate
        if: ${{ needs.gate.outputs.ready == 'true' }}
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Fetch the fonts
              run: |
                  git init "$RUNNER_TEMP/fonts"
                  git -C "$RUNNER_TEMP/fonts" remote add origin https://github.com/HeroicLands/fonts.git
                  git -C "$RUNNER_TEMP/fonts" fetch --depth 1 origin "$FONTS_REVISION"
                  git -C "$RUNNER_TEMP/fonts" checkout --detach FETCH_HEAD

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}

            - name: Install Thalorna dependencies
              run: npm ci --cache "$RUNNER_TEMP/npm-cache"

            # Only the shaping/outline libraries used by the pinned native guards.
            - name: Install the guards' packages
              run: |
                  grep -iE '^(fonttools|uharfbuzz|pillow|pyyaml|ufoLib2)==' "$RUNNER_TEMP/fonts/requirements.txt" > "$RUNNER_TEMP/guard-requirements.txt"
                  python3 -m venv "$RUNNER_TEMP/venv"
                  "$RUNNER_TEMP/venv/bin/pip" install --quiet -r "$RUNNER_TEMP/guard-requirements.txt"

            - name: Pirzath Carved native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/pirzath/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/PirzathCarved-Regular.ttf"

            - name: Pirzath Hand native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/pirzath-hand/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/PirzathHand-Regular.ttf"

            - name: Thuravark Carved native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/thuravark-carved/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/ThuravarkCarved-Regular.ttf"

            - name: Qalezu Hand native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/qalezu-hand/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/QalezuHand-Regular.ttf"

            - name: Semaron Kuriale native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/semaron-kuriale/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/SemaronKuriale-Regular.ttf"

            - name: Helónika native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/helonika/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/HelonikaBook-Regular.ttf"

            - name: Vedyakshara Classical native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/vedyakshara/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/VedyaksharaClassical-Regular.ttf"

            - name: Veldikko native fixtures and geometry
              if: ${{ !cancelled() }}
              run: >-
                  "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/fonts/tools/veldikko/guard.py"
                  --font "$GITHUB_WORKSPACE/node_modules/@heroiclands/fonts/fonts/Veldikko-Regular.ttf"

            - name: Independent spelling model expectations
              if: ${{ !cancelled() }}
              run: '"$RUNNER_TEMP/venv/bin/python" utils/font-expectations.test.py'

            - name: Shape every lexicon form through its encoding document
              if: ${{ !cancelled() }}
              run: |
                  node utils/font-lexicon-inputs.mjs "$RUNNER_TEMP/font-lexicon-inputs.json"
                  "$RUNNER_TEMP/venv/bin/python" utils/font-lexicon-guard.py --fonts "$RUNNER_TEMP/fonts" --input "$RUNNER_TEMP/font-lexicon-inputs.json"

    lint:
        name: Content, prose, and registry checks
        needs: [gate, format, guards, fonts, build]
        if: ${{ !cancelled() }}
        # Only reads the other jobs' results, so it takes no lint slot.
        runs-on: ubuntu-latest

        steps:
            - name: Require a ready pull request
              id: ready
              env:
                  READY: ${{ needs.gate.outputs.ready }}
              run: |
                  if [ "$READY" = false ]; then
                      echo "WIP pull request: the long checks have not run. Remove WIP with earl pr ready." >&2
                      exit 1
                  fi
            - name: Every check passed
              if: ${{ steps.ready.outcome == 'success' && success() }}
              run: |
                  results='${{ join(needs.*.result, ' ') }}'
                  echo "check results: $results"
                  for r in $results; do
                      [ "$r" = success ] || { echo "a check did not pass"; exit 1; }
                  done

    build:
        name: Content pack compile
        needs: gate
        if: ${{ needs.gate.outputs.ready == 'true' }}
        runs-on: build

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Clear content publication
              id: publication_reset
              run: rm -rf build/content-index

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: ${{ vars.CI_NODE_VERSION || '24' }}

            # Restored on an unchanged lockfile and Node version; the install
            # runs only on a miss. A restore leaves `node_modules/.bin` intact.
            - name: Cache node_modules
              id: modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}

            - name: Cache npm downloads
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/npm-cache
                  key: ${{ runner.os }}-npm-node-24-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              if: ${{ steps.modules.outputs.cache-hit != 'true' }}
              run: npm ci --cache "$RUNNER_TEMP/npm-cache"

            # Prepare dependencies and assets, then validate and compile the
            # content in one session.
            - name: Compile the content packs
              run: npm run build:db

            # The marker survives failures after publication. Missing publication
            # fails this guard without reading a partial or stale index.
            - name: Veldikko
              if: ${{ !cancelled() && steps.publication_reset.outcome == 'success' }}
              run: |
                  if [ ! -f build/content-index/.publication-ready ]; then
                      echo "Veldikko: no fresh content index was published in this run." >&2
                      exit 1
                  fi
                  node utils/veldikko-guard.mjs --index build/content-index/thalorna-metadata.jsonl

            # Keep JSON intermediates and compiled packs for acceptance inspection.
            - name: Record compiled pack provenance
              run: |
                  test -d build/packs-json/actors/
                  test -d build/packs-json/items/
                  test -d build/stage/packs/actors/
                  test -d build/stage/packs/items/
                  mkdir -p build/compiled-provenance
                  git rev-parse HEAD > build/compiled-provenance/source-sha.txt
                  cp package-lock.json build/compiled-provenance/package-lock.json
                  node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("node_modules/@heroiclands/package-build/package.json", "utf8")); fs.writeFileSync("build/compiled-provenance/package-build-version.txt", pkg.version + "\n");'

            - name: Retain compiled packs for acceptance inspection
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: thalorna-compiled-packs
                  path: |
                      build/packs-json/actors/
                      build/packs-json/items/
                      build/stage/packs/actors/
                      build/stage/packs/items/
                      build/compiled-provenance/
                  if-no-files-found: error
                  retention-days: 3
