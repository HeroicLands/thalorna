# Run the checks on the pull request that broke them, not on the release
# afterwards.
#
# The four content repositories run this same file. What differs between them
# is only what they have to check: `lint:lang` appears where there is a
# `lang/` tree and not otherwise, because a step with nothing to check is not
# parity — it is a green tick that means nothing.
#
# ## Named steps, not one `npm run lint`
#
# `npm run lint` chains with `run-s`, which stops at the first failure, so a
# single step reports whichever check failed first and says nothing about the
# rest — the checks past the break have no known state. Each check here runs
# under `if: \${{ !cancelled() }}`, so one failure does not hide the others,
# and a red run is a worklist rather than a wall.
#
# ## Thalorna's checks run as parallel jobs
#
# The other content repositories run these checks as steps of one job.
# Thalorna's tree is large enough that the single job ran close to the runner's
# 30-minute limit and was killed there, so its checks are four jobs that run
# side by side on separate workers, and the lint takes as long as the slowest
# of them. A final job, `Content, prose, and registry checks`, waits for all
# four and fails when any of them failed; it is the name branch protection
# requires, so the checks report as one. Each job pays its own checkout and
# `npm ci`, about a minute.
#
# The lexicons are deliberately absent, and so is the drift sweep. A lexicon
# judges one culture's names against the phonology its own language note
# publishes, and there is one per culture — Nordmal, Varokhi, Khelâthi, and
# whichever comes next. Each reports the names a renaming has not yet reached,
# so each is red by design while that renaming is in progress, and holding the
# whole tree red on one culture's backlog tells a contributor nothing about the
# change in front of them. They are run on demand:
# `npm run lint:khelathi-lexicon`, `lint:nordmal-lexicon`,
# `lint:varokhi-lexicon`.
#
# `lint:drift` reports old names surviving in prose, and
# `lint:nordmal-concordance` judges the table it and the Nordmal lexicon read.
# Both are red on the same backlog and both are run the same way.
#
# ## The compile runs after the checks
#
# It is the only job here that reaches the network — a satellite fetches the
# pinned system release its actors resolve against — and it is the longest, so
# it runs only once every check has passed: a tree that fails its checks is not
# worth compiling, and the compile's runner stays free for a tree that passes.
#
# Every run is cold: `build/` is gitignored and holds the dependency catalogue
# too, so a runner starts with nothing.
name: Lint

on:
    pull_request:
        types: [opened, reopened, synchronize]
    # Post-merge signal too: nothing else checks `main` between releases.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    format:
        name: Formatting, markdown and localization
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Prettier over the whole tree.
            - name: Check formatting
              run: npm run lint:format

            # markdownlint: document structure, and links that do not link.
            - name: Check markdown
              if: ${{ !cancelled() }}
              run: npm run lint:markdown

            # No dotted-prefix collision in `lang/*.json`: Foundry drops a
            # translation file whose key is both a leaf and a branch.
            - name: Check localization files
              if: ${{ !cancelled() }}
              run: npm run lint:lang

    addresses:
        name: Addresses and frontmatter
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # `sohl`'s content index is fetched, not vendored, and both address
            # checks refuse to run without it rather than guess.
            - name: Fetch the dependency content index
              run: npm run build:deps

            # Frontmatter against the schema each note's type declares.
            - name: Check addresses and frontmatter
              run: npm run lint:addresses

    links:
        name: Content links
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # `sohl`'s content index is fetched, not vendored, and both address
            # checks refuse to run without it rather than guess.
            - name: Fetch the dependency content index
              run: npm run build:deps

            # Every anchor link lands and every qualified address resolves.
            - name: Check content links
              run: npm run lint:content-links

    guards:
        name: Reference people and utility tests
        runs-on: lint

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The utility tests read pinned revisions with `git show`, so
                  # the job needs the history a shallow checkout leaves out.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # A named person the prose leans on resolves to a note.
            - name: Check reference people
              run: npm run lint:reference-people

            # The tree's own guards: the lexicons and their name registers, the
            # concordance, the deployment headers. Two pull requests that pass
            # alone can fail together, and this catches that before merge.
            - name: Run the utility tests
              if: ${{ !cancelled() }}
              run: node --test 'utils/**/*.test.mjs'

    lint:
        name: Content, prose, and registry checks
        runs-on: lint
        needs: [format, addresses, links, guards]
        if: ${{ !cancelled() }}

        steps:
            - name: Every check passed
              run: |
                  results='${{ join(needs.*.result, ' ') }}'
                  echo "check results: $results"
                  for r in $results; do
                      [ "$r" = success ] || { echo "a check did not pass"; exit 1; }
                  done

    build:
        name: Content pack compile
        runs-on: build
        needs: [lint]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Stages the tree, compiles every pack, and emits the content index
            # — the cold build a tree that has already built once cannot
            # perform on itself.
            - name: Compile the content packs
              run: npm run build:db
