# Formatting, prose, and registry checks run beside the shared content run.
# The build job fetches pinned dependencies, prepares the content index,
# calendars and assets, then checks frontmatter and links and compiles packs
# in one content session. build/ is gitignored, so content builds start cold.
# Retired-name and concordance sweeps run on demand.
name: Lint

on:
    pull_request:
        types: [opened, reopened, synchronize]

permissions:
    contents: read

jobs:
    lint:
        name: Content, prose, and registry checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The utility tests read pinned revisions with `git show`
                  # (the concordance test cites a file at a fixed commit), so
                  # the job needs the history a shallow checkout leaves out.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Prettier over the whole tree.
            - name: Check formatting
              run: npm run lint:format

            # markdownlint: document structure, and links that do not link.
            - name: Check markdown
              if: ${{ !cancelled() }}
              run: npm run lint:markdown

            # No dotted-prefix collision in `lang/*.json`. A key that is both a
            # leaf and a branch makes `foundry.utils.expandObject` throw, and
            # Foundry then drops the whole translation file.
            - name: Check localization files
              if: ${{ !cancelled() }}
              run: npm run lint:lang

            # A named person the prose leans on resolves to a note.
            - name: Check reference people
              if: ${{ !cancelled() }}
              run: npm run lint:reference-people

            # The tree's own guards: the concordance, the deployment headers. They read the content, so
            # two pull requests that pass alone can fail together; running them
            # here catches that before merge rather than in the deploy.
            - name: Run the utility tests
              if: ${{ !cancelled() }}
              run: node --test 'utils/**/*.test.mjs'

    build:
        name: Content pack compile
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Prepare dependencies and assets, then validate and compile the
            # content in one session.
            - name: Compile the content packs
              run: npm run build:db
