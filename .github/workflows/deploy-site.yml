# Build and deploy /thalorna — this repository's own website (#1451).
#
# This package renders its own HTML and publishes its own subtree. No other
# repository is in the path between it and its readers: a checkout, the theme
# submodule, Node and Hugo are the whole build, and the deploy uses credentials
# scoped to this package's own hosting project. That is what makes the package
# movable — a successor inheriting only this repository can publish it (#1444).
name: Deploy the Thalorna site to Cloudflare Pages

on:
    # Every push to `main` republishes the site. No path filter: a rebuild is
    # cheap next to how quietly a hand-maintained path list goes stale, and a push
    # that changes nothing the site serves merely republishes the same bytes.
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: thalorna-site-deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        # Job-level, so each step's `if` can ask whether the credentials exist:
        # a secret cannot be tested directly in a condition.
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Before anything is built, let alone uploaded. The payload asserted
            # here is a string constant, so this needs no build output — and the
            # assertion that matters is a NEGATIVE one (see the step further
            # down), which no amount of inspecting the built tree would catch.
            # `node --test` needs neither a dependency nor a configuration file;
            # this repository has no test harness, and introducing one to assert
            # one constant would be the larger change.
            - name: Assert the deployment root's headers
              run: node --test 'utils/*.test.mjs'

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.163.3"
                  extended: true

            - name: Build the site
              run: npm run build:site

            # Cloudflare Pages serves the deployment's 404.html — with a real
            # 404 status — for any unmatched path, and falls back to the site
            # root when the file is missing. That fallback is a soft-404 (200
            # carrying the landing page), which reads as success to every link
            # check, so assert the file exists rather than discovering its
            # absence in production (#1416).
            - name: Verify the 404 page was built
              run: test -s build/site/thalorna/404.html

            # Nothing outside /thalorna is this repository's to publish, and a
            # deploy is a whole-subtree replacement — so prove the tree carries
            # at least one page, and stop before uploading if the build came out
            # empty.
            - name: Verify the tree is a complete site
              run: |
                  test -s build/site/thalorna/index.html
                  pages=$(find build/site/thalorna -name index.html | wc -l)
                  echo "build/site/thalorna carries $pages page(s)"
                  test "$pages" -gt 1000

            # The hosting project answers at three addresses of its own —
            # sohl-thalorna.pages.dev, one per deployment, and
            # thalorna.pkg.heroiclands.org — as well as under
            # www.heroiclands.org, and a second address for the same pages can
            # be indexed and compete with the canonical URL. `_headers` marks
            # those hostnames noindex, but only at the deployment ROOT, which is
            # the sole place Pages reads it
            # (HeroicLands/Song-of-Heroic-Lands-FoundryVTT#1469, #96).
            #
            # THE PAYLOAD IS THIS REPOSITORY'S, whatever workflow deploys it.
            # The reusable workflow in `HeroicLands/.github` writes the same
            # three rules as a DEFAULT, and only when the build produced none —
            # "a package that emits its own keeps it, byte for byte" — and
            # `utils/build-site-root.mjs` writes one unconditionally. Its
            # completeness guard says as much: "a package that emits its OWN
            # `_headers` passes this check with whatever it wrote, so it is that
            # package's job to cover the custom domain too." So this stays true
            # if this repository ever does migrate, and the three rules must
            # come with it. Whether to migrate is a separate question with its
            # own reasons; #96 deliberately did not decide it.
            - name: Verify the deployment root carries its headers
              run: test -s build/site/_headers

            # The hosting project and the path-prefix routing that puts it at
            # www.heroiclands.org/thalorna are #1468. Until its credentials are
            # set here the build still runs on every push — which is the half
            # of this workflow that catches a broken site — and the upload
            # skips rather than failing.
            # A Pages project is account state, not repository state, so without
            # this a clone of this repository plus a scoped token still could not
            # publish: someone would have to know to create the project by hand
            # first. That hidden step is exactly what the succession test behind
            # #1444 exists to remove, and it costs one API call to close.
            #
            # Checked before creating rather than tolerating the create's failure,
            # so a genuine error (a bad token, a revoked scope) still fails the run.
            #
            # `sohl-thalorna` here is the Pages PROJECT name, which is account
            # state and independent of the Foundry package id. The project
            # carries the custom domain the router fetches
            # (thalorna.pkg.heroiclands.org), and Cloudflare Pages has no
            # in-place rename: changing this string makes the lookup 404 and
            # creates a second, domainless project, leaving every reader served
            # by the first one — which then never receives another deployment.
            # Move the domain onto a new project before changing the name here.
            - name: Ensure the hosting project exists
              if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
              run: |
                  set -euo pipefail
                  api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
                  code=$(curl -sS -o /dev/null -w '%{http_code}' \
                         -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                         "${api}/sohl-thalorna")
                  case "$code" in
                    200) echo "Pages project sohl-thalorna already exists." ;;
                    404) echo "Creating Pages project sohl-thalorna."
                         npx --yes wrangler@4 pages project create sohl-thalorna \
                           --production-branch=main ;;
                    *)   echo "::error::Cloudflare answered ${code} for the project lookup."
                         exit 1 ;;
                  esac

            - name: Deploy to Cloudflare Pages (production)
              if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy build/site --project-name=sohl-thalorna --branch=main

            - name: Say why nothing was uploaded
              if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
              run: |
                  echo "::notice::Built the site but did not deploy it: this repository has no" \
                       "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID yet. The hosting project is #1468."
