# The outline registry: each note kind's sections, called slots. The outline
# guard (utils/outline-guard.mjs) reads this file and checks a note's heading
# anchors (`## Any Wording {#id}`) against the entry its kind selects. It checks
# ids and their order, never heading wording.

# A note of at most this many words is a row-depth stub. A slot with
# `needs: summary` is required only of a note longer than this.
rowMaxWords: 200

# A land is a group of regions named here: a land id maps to the shortcodes of
# the notes that make it up. A note is in a land when a parent branch (or, for a
# being, a home) reaches one of them, the nearest one along each branch
# counting. A note in no land is only ever reported.
lands:
    midhalion: [midhalnrgn, vylariargn, taruzelrgn]
    khazryn: [khzryndsrtrgn]
    tarvenia: [tarvenirgn]
    elavendre: [elavendre]
    provenzia: [provenzrgn]
    hellad: [heladrgn]
    kalipsa-aelwyth: [aelwyth, calypsacity]
    dunhara: [dunharargn]
    kiichchik: [northkiichchik, centralkiichchik, southkiichchik]
    nordlands: [nrdlndsrgn]
    kalihara: [kaliharargn]
    zerathia: [nrthrnfrtlrgn, cntrlrnfrsts, sthmrchsrgn, sthrnsvnhs, velkhara]
    jenchai: [jenchairgn]
    tantsou: [tantsouregin]
    vedyara: [vedyarargn]
    velanthia: [velanthrgn]
    grukarholm: [grkrhlmrgn]

# The archetypes a land's beings are expected to cover (the plan's C.6.1). The
# coverage guard (utils/coverage-guard.mjs) reports each one a land lacks.
archetypes:
    - warrior
    - skirmisher
    - infiltrator
    - mage
    - cleric
    - healer
    - scholar
    - courtier
    - woodsman
    - mariner
    - artisan
    - trader
    - commoner
    - entertainer
    - guildsperson

# An archetype a land's canon excludes: land id, then archetype, then the reason.
archetypeAbsences: {}

# Addresses of affiliations whose shared governance block an owner ruling keeps.
sharedGovernance: []

# Settlements an owner exception excuses from a homed being: address, then the reason.
homedBeingExceptions:
    place-serenthale: No human record names the people of the Sinale enclave.
    place-aelirosse: No human record names the people of the Sinale enclave.

# Ids of the lands held to this registry. A finding in a finished land is an
# error; in every other land it is a warning.
finished: []

# Each entry selects notes by `type`, `subType` and tags (`anyTag`: at least one;
# `noTag`: none) and gives its slots in the order they must appear. The first
# entry that matches a note applies. `profile` is the number of the kind's
# profile in the plan. A slot's status is `required`, `warranted` (written when
# the land calls for it) or `optional`. A kind may list `absent` slot ids that
# its notes never carry. `closing: [truth]` names the slots that may follow
# See Also. A slot's heading is at `level` (`slotLevel` unless the slot says
# otherwise); a heading at another level does not fill the slot. `match.data`
# selects on frontmatter `data` keys, and `match.subType` may be a list. A
# `profile` is a number, or a list of numbers, from the plan's adopted profiles.
closing: [truth]
slotLevel: 2

kinds:
