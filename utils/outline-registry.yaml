      profile: 26
      match: { data: { unique: true } }
      slots:
          - { id: overview, heading: Overview, status: warranted }
          - { id: who-holds-it, heading: Who Holds It, status: warranted }
          - { id: its-story, heading: Its Story, status: warranted }
          - { id: what-it-does, heading: What It Does, status: warranted }
