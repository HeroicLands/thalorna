# Not defects. The guard finds each of these first and no retired token fires
# inside one, so a name that stays is never swept out of a word that keeps it.
keep:
    - {
          literal: Helspawn,
          why: the north's own word for what Náhild makes,
          kept beside the learned term,
      }
    - { literal: Asguard, why: the tree's own drift }
    - { literal: Asguardian, why: the tree's own drift }
    - { literal: Asgarthul, why: Asguard's Hall, Norgaad's seat }
    - { literal: Njörven, why: the elder sea-power, who is not Njörvar }
    - { literal: Thrumufjall, why: Thrúnvald's holy mountain }
    - { literal: Stormmaelendir, why: already the setting's }
    - { literal: Skaldahringr, why: already the setting's }
    - { literal: Málalidabandalag, why: already the setting's }
