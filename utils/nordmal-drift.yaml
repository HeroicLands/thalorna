# The Nordmal drift: every retired Earth name and the setting's name for it.
#
# This file is the single source. The guard reads it, every packet edits from
# it, and nothing anywhere else restates a pair — a second copy drifts from the
# first the moment either is edited.
#
# `retired` is matched whole-word and case-sensitively. Every spelling the
# corpus writes is a row of its own, because a rule written from one spelling
# passes over the others and reports clean: `Odinn` and `Ódinn` are both
# labels on one address, and `Njördur`, `Njördr` and `Ragnarok` are each
# written beside a marked form.
#
# A possessive fires: the boundary permits `'s` and nothing else, so
# `Ódinn's`, `Týr's Justice` and `Ymir's Children` are found while a foreign
# compound carrying an apostrophe is not.
#
# `layer` names the packet that owns the pair — 1 for the names the plan
# approves and writes into the anchor notes, 2 for the mechanical sweep
# through every other file. `note` carries a reason where one is needed.
# `drop: true` marks a name that is retired and not replaced.
# `suffix: true` lets a row match through an inflection, which is how one row
# covers a name the corpus writes both bare and declined.
# `exceptFollowedBy` and `exceptPrecededBy` are regular expressions that hold a
# short token to its context; every occurrence they exclude is counted and
# printed, because a filter nobody sees is a filter that hides a survivor.
#
# Shortcodes are addresses and stay the Earth names. A shortcode line, a file
# path, a wikilink's target, an `affiliation-<god>` line, a `terran_analog`
# value and fenced code are read by nobody and are not swept. A wikilink's
# label is prose and is.

# What the guard reads as Nordmal or Varokhi material for the romanisation.
# The drift itself is swept over the whole tree, because a foreign note naming
# a Nordland god names a Nordland thing.
scope:
    paths:
        - Regions/Ankaris/Nordlands/
        - Regions/Ankaris/Vrystwald/
        - Affiliations/Divine/Asguardian/
        - Affiliations/Organizations/Asguardian_Orders/
        - Skills/Mystical/Asguardian/
        - Lore/Deities/Asguardian/
        - Characters/Heroes_of_Asguard/
    notes:
        - Skills/Languages/Nordmal.md
        - Skills/Languages/Varokhi.md
        - Affiliations/Organizations/Skalds_Circle.md
        - Affiliations/Organizations/Malalidabandalag.md
        - Affiliations/Social/Companies/The_Blackpine_Wolves.md
        - Affiliations/Social/Companies/Wuldjagar_erund_Garskald.md
    homes: [nrdlndsrgn, vrystwald]

romanisation:
    # The rule is read off the language note's own table rather than copied
    # here: the `written` column gives the letters and the marks Nordmal
    # spells, the `never` column gives the letters it does not, and the
    # sentence beneath gives the assembly its hard opening.
    note: assets/content/Skills/Languages/Nordmal.md
    section: Romanizing Nordmal
    assembly: ting

    # Words of other tongues that stand in Nordmal notes and carry another
    # language's marks. Each is named so the guard reads past it and prints
    # what it read past.
    foreign:
        - { word: Aurèldía, tongue: Aurèldían }
        - { word: Aurèldían, tongue: Aurèldían }
        - { word: Aurèldíans, tongue: Aurèldían }
        - { word: Provènzia, tongue: Provenzal }
        - { word: Tānvür, tongue: Tanvuri }
        - { word: Aû, tongue: Khelâthi }
        - { word: Khelâthu, tongue: Khelâthi }
        - { word: Sêmarion, tongue: Sinalëan }
        - { word: Tamzîr, tongue: Haradi }
        - { word: Kasûra, tongue: Haradi }
        - { word: Damzarû, tongue: Haradi }
        - { word: Eshârum, tongue: Haradi }
        - { word: Tarûzî, tongue: Haradi }
        - { word: Shâ, tongue: Dunhari }

    # Spellings of names that stay, written against the rule.
    variants:
        - { retired: Bjorg, replacement: Björg, layer: 2, note: the rounded back vowel is written }

