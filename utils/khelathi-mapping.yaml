# The eighteen elements that build the six name lists. They are generators
# rather than tokens: `sat`, `ren`, `ka` and `hat` are ordinary English words,
# and sweeping them through prose replaces the wrong thing. The guard holds them
# to the coinage rules and does not hunt them in the tree; what it hunts is the
# names they produce.
nameElements:
    - { retired: ankh, replacement: anlagh, layer: 6, generator: true }
    - { retired: neb, replacement: zab, layer: 6, generator: true }
    - { retired: nefer, replacement: legir, layer: 6, generator: true }
    - { retired: mer, replacement: amqel, layer: 6, generator: true }
    - { retired: ka, replacement: gul, layer: 6, generator: true }
    - { retired: bek, replacement: lem, layer: 6, merges: true, generator: true }
    - { retired: sat, replacement: gith, layer: 6, generator: true }
    - { retired: hotep, replacement: legez, layer: 6, generator: true }
    - { retired: sen, replacement: lin, layer: 6, generator: true }
    - { retired: ken, replacement: quz, layer: 6, generator: true }
    - {
          retired: akhet,
          replacement: anleth,
          layer: 6,
          note: the horizon,
          not the season,
          generator: true,
      }
    - { retired: ba, replacement: zin, layer: 6, generator: true }
    - { retired: djet, replacement: gez, layer: 6, generator: true }
    - { retired: khent, replacement: qelt, layer: 6, generator: true }
    - { retired: hat, replacement: qelt, layer: 6, merges: true, generator: true }
    - { retired: ren, replacement: reth, layer: 6, generator: true }
    - { retired: wat, replacement: wal, layer: 6, generator: true }
    - { retired: Nakhtar, replacement: Quztar, layer: 6, note: carries nakht }
    - { retired: Nebmaatre, replacement: Zabqarrê, layer: 6, note: throne name of Amenhotep III }

# Not defects. Listed so a sweep does not touch them and a reviewer does not ask.
keep:
    - nomarch is dropped rather than replaced; the holder is the Halzi'a
    - vizier, hieroglyph, hieratic, natron, papyrus, pyramid, obelisk, mummification
    - mastaba — narrator's English, ruled explicitly
    - The Five Intercalary Days, Keeper of the Granaries, Warden of Seals, Reader of the Hours
    - Scribe, Farmer, Bondsman, Artisan, Merchant, Outcast
