# The Khelâthi lexicon: every retired token and what replaces it.
#
# This file is the single source. The guard reads it, every packet edits from
# it, and nothing anywhere else restates a pair — a second copy is one more
# thing to drift.
#
# `retired` is matched whole-word and case-sensitively, because `Ra`, `Set`,
# `Min`, `Sau`, `Imet`, `Ipu`, `Wab` and `Sile` are all substrings of ordinary
# words. A sweep runs from this table and never from a bare pattern.
#
# `layer` names the packet that owns the pair. `note` carries a reason where
# one is needed.

realm:
    - { retired: "Ta'Kheperu", replacement: "Aû'Khelâthu", layer: 1, note: formal }
    - { retired: Ta.Kheperu, replacement: Khelathu, layer: 1, note: directory and file names }
    - { retired: Kheperi, replacement: Khelâthi, layer: 1 }
    - { retired: Kheperan, replacement: Khelâthi, layer: 1, merges: true }
    - { retired: Kheperian, replacement: Khelâthi, layer: 1, merges: true }
    - { retired: Kemetian, replacement: Khelâthi, layer: 1, merges: true }
    - { retired: Kemetían, replacement: Khelâthi, layer: 1, merges: true }
    - { retired: Kemet, replacement: Khelâthu, layer: 1, note: Egypt's own name for itself }
    - { retired: Kheperi-sesh, replacement: Khelâthi-zethu, layer: 1, note: the sacred hand }
    - { retired: Demotika, replacement: Qalezu, layer: 1, note: the common hand }

